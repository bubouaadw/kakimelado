<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Labirinto Arcade</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: radial-gradient(circle, #12174a 0%, #050615 65%);
      color: white;
      font-family: Arial, sans-serif;
      user-select: none;
    }

    .game {
      width: min(94vw, 650px);
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      color: #ffe600;
      font-size: clamp(28px, 6vw, 48px);
      text-shadow: 0 0 18px #ff9d00;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      font-weight: bold;
      font-size: clamp(14px, 3vw, 20px);
    }

    .board {
      position: relative;
      width: 100%;
      aspect-ratio: 19 / 21;
      background: #02020c;
      border: 4px solid #243cff;
      border-radius: 10px;
      box-shadow: 0 0 24px #172cff;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .message {
      position: absolute;
      inset: 0;
      display: none;
      place-content: center;
      padding: 24px;
      background: rgba(0, 0, 10, .78);
      font-size: clamp(24px, 6vw, 45px);
      font-weight: bold;
      text-shadow: 0 0 12px #000;
    }

    .message.show { display: grid; }

    button {
      margin-top: 18px;
      padding: 12px 24px;
      border: 0;
      border-radius: 999px;
      background: #ffe600;
      color: #080814;
      font: inherit;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 15px #ffb300;
    }

    .help {
      margin: 12px 0 0;
      color: #b8c0ff;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="game">
    <h1>LABIRINTO ARCADE</h1>

    <div class="hud">
      <span>Placar: <b id="score">0</b></span>
      <span>Vidas: <b id="lives">3</b></span>
      <span>Fase: <b id="level">1</b></span>
    </div>

    <div class="board">
      <canvas id="canvas"></canvas>

      <div id="message" class="message">
        <div>
          <div id="messageText"></div>
          <button id="restart">Jogar novamente</button>
        </div>
      </div>
    </div>

    <p class="help">Setas ou WASD - no celular, deslize sobre o jogo</p>
  </main>

  <script>
    const originalMap = [
      "###################",
      "#o.......#.......o#",
      "#.###.##.#.##.###.#",
      "#.................#",
      "#.###.#.###.#.###.#",
      "#.....#..#..#.....#",
      "#####.##.#.##.#####",
      "    #.#.....#.#    ",
      "#####.#.###.#.#####",
      "......#.....#......",
      "#####.#.###.#.#####",
      "    #.#.....#.#    ",
      "#####.#.###.#.#####",
      "#........#........#",
      "#.###.##.#.##.###.#",
      "#o..#.........#..o#",
      "###.#.#.###.#.#.###",
      "#.....#..#..#.....#",
      "#.#######.#######.#",
      "#.................#",
      "###################"
    ];

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const livesEl = document.getElementById("lives");
    const levelEl = document.getElementById("level");
    const message = document.getElementById("message");
    const messageText = document.getElementById("messageText");

    const COLS = originalMap[0].length;
    const ROWS = originalMap.length;
    const directions = {
      left:  { x: -1, y: 0 },
      right: { x: 1, y: 0 },
      up:    { x: 0, y: -1 },
      down:  { x: 0, y: 1 }
    };

    let map, tile, score, lives, level, running;
    let player, ghosts, lastTime, frightenedUntil;

    function resize() {
      const board = canvas.parentElement;
      const rect = board.getBoundingClientRect();
      canvas.width = Math.floor(rect.width * devicePixelRatio);
      canvas.height = Math.floor(rect.height * devicePixelRatio);
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      tile = rect.width / COLS;
    }

    function makeActor(x, y, color, direction = "left") {
      return {
        x, y,
        startX: x,
        startY: y,
        dir: direction,
        nextDir: direction,
        progress: 0,
        color
      };
    }

    function resetActors() {
      player = makeActor(9, 15, "#ffe600", "left");
      ghosts = [
        makeActor(9, 9, "#ff355e", "left"),
        makeActor(8, 9, "#ff8de5", "right"),
        makeActor(10, 9, "#35e9ff", "left"),
        makeActor(9, 11, "#ff9f31", "right")
      ];
      frightenedUntil = 0;
    }

    function newGame() {
      map = originalMap.map(row => row.split(""));
      score = 0;
      lives = 3;
      level = 1;
      running = true;
      resetActors();
      updateHud();
      message.classList.remove("show");
      lastTime = performance.now();
    }

    function updateHud() {
      scoreEl.textContent = score;
      livesEl.textContent = lives;
      levelEl.textContent = level;
    }

    function isWall(x, y) {
      if (y < 0 || y >= ROWS) return true;
      if (x < 0 || x >= COLS) return false;
      return map[y][x] === "#";
    }

    function wrap(actor) {
      if (actor.x < 0) actor.x = COLS - 1;
      if (actor.x >= COLS) actor.x = 0;
    }

    function canMove(actor, dirName) {
      const d = directions[dirName];
      return !isWall(actor.x + d.x, actor.y + d.y);
    }

    function moveActor(actor, speed, dt, isPlayer = false) {
      if (actor.progress === 0) {
        if (isPlayer && canMove(actor, actor.nextDir)) {
          actor.dir = actor.nextDir;
        }

        if (!isPlayer) chooseGhostDirection(actor);
        if (!canMove(actor, actor.dir)) return;
      }

      actor.progress += speed * dt;

      while (actor.progress >= 1) {
        const d = directions[actor.dir];
        actor.x += d.x;
        actor.y += d.y;
        wrap(actor);
        actor.progress -= 1;

        if (isPlayer) {
          eatTile();

          if (canMove(actor, actor.nextDir)) {
            actor.dir = actor.nextDir;
          }
        } else {
          chooseGhostDirection(actor);
        }

        if (!canMove(actor, actor.dir)) {
          actor.progress = 0;
          break;
        }
      }
    }

    function chooseGhostDirection(ghost) {
      const opposite = {
        left: "right",
        right: "left",
        up: "down",
        down: "up"
      };

      let options = Object.keys(directions).filter(name =>
        canMove(ghost, name) && name !== opposite[ghost.dir]
      );

      if (!options.length) {
        options = Object.keys(directions).filter(name => canMove(ghost, name));
      }

      const frightened = performance.now() < frightenedUntil;

      options.sort((a, b) => {
        const da = distanceAfterMove(ghost, a);
        const db = distanceAfterMove(ghost, b);
        return frightened ? db - da : da - db;
      });

      ghost.dir = Math.random() < 0.7
        ? options[0]
        : options[Math.floor(Math.random() * options.length)];
    }

    function distanceAfterMove(actor, direction) {
      const d = directions[direction];
      return Math.hypot(
        actor.x + d.x - player.x,
        actor.y + d.y - player.y
      );
    }

    function eatTile() {
      const cell = map[player.y]?.[player.x];

      if (cell === ".") {
        map[player.y][player.x] = " ";
        score += 10;
      } else if (cell === "o") {
        map[player.y][player.x] = " ";
        score += 50;
        frightenedUntil = performance.now() + 7000;
      }

      updateHud();

      const pelletsLeft = map.some(row =>
        row.some(cell => cell === "." || cell === "o")
      );

      if (!pelletsLeft) nextLevel();
    }

    function nextLevel() {
      level++;
      score += 500;
      map = originalMap.map(row => row.split(""));
      resetActors();
      updateHud();
    }

    function actorPosition(actor) {
      const d = directions[actor.dir];
      return {
        x: actor.x + d.x * actor.progress,
        y: actor.y + d.y * actor.progress
      };
    }

    function checkCollisions() {
      const p = actorPosition(player);

      for (const ghost of ghosts) {
        const g = actorPosition(ghost);
        const distance = Math.hypot(p.x - g.x, p.y - g.y);

        if (distance < 0.65) {
          if (performance.now() < frightenedUntil) {
            score += 200;
            ghost.x = ghost.startX;
            ghost.y = ghost.startY;
            ghost.progress = 0;
            updateHud();
          } else {
            loseLife();
          }
          return;
        }
      }
    }

    function loseLife() {
      lives--;
      updateHud();

      if (lives <= 0) {
        running = false;
        messageText.textContent = `Fim de jogo - ${score} pontos`;
        message.classList.add("show");
      } else {
        resetActors();
      }
    }

    function drawMaze() {
      ctx.fillStyle = "#02020c";
      ctx.fillRect(0, 0, canvas.clientWidth, canvas.clientHeight);

      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const cell = map[y][x];
          const px = x * tile;
          const py = y * tile;

          if (cell === "#") {
            ctx.fillStyle = "#1537e8";
            ctx.fillRect(px + 1, py + 1, tile - 2, tile - 2);
            ctx.strokeStyle = "#5574ff";
            ctx.lineWidth = Math.max(1, tile * 0.07);
            ctx.strokeRect(px + 3, py + 3, tile - 6, tile - 6);
          } else if (cell === "." || cell === "o") {
            ctx.beginPath();
            ctx.fillStyle = "#ffe5b2";
            ctx.arc(
              px + tile / 2,
              py + tile / 2,
              cell === "o" ? tile * 0.18 : tile * 0.06,
              0,
              Math.PI * 2
            );
            ctx.fill();
          }
        }
      }
    }

    function drawPlayer(time) {
      const p = actorPosition(player);
      const cx = (p.x + 0.5) * tile;
      const cy = (p.y + 0.5) * tile;
      const radius = tile * 0.4;
      const mouth = 0.18 + Math.abs(Math.sin(time / 90)) * 0.25;

      const angles = {
        right: 0,
        down: Math.PI / 2,
        left: Math.PI,
        up: -Math.PI / 2
      };

      const angle = angles[player.dir];
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, radius, angle + mouth, angle - mouth + Math.PI * 2);
      ctx.closePath();
      ctx.fillStyle = player.color;
      ctx.fill();
    }

    function drawGhost(ghost, time) {
      const p = actorPosition(ghost);
      const x = (p.x + 0.5) * tile;
      const y = (p.y + 0.5) * tile;
      const r = tile * 0.38;
      const frightened = time < frightenedUntil;

      ctx.fillStyle = frightened
        ? (frightenedUntil - time < 2000 && Math.floor(time / 180) % 2
            ? "#ffffff"
            : "#234dff")
        : ghost.color;

      ctx.beginPath();
      ctx.arc(x, y, r, Math.PI, 0);
      ctx.lineTo(x + r, y + r);
      ctx.lineTo(x + r / 2, y + r * 0.72);
      ctx.lineTo(x, y + r);
      ctx.lineTo(x - r / 2, y + r * 0.72);
      ctx.lineTo(x - r, y + r);
      ctx.closePath();
      ctx.fill();

      if (!frightened) {
        const d = directions[ghost.dir];

        for (const offset of [-r * 0.38, r * 0.38]) {
          ctx.beginPath();
          ctx.fillStyle = "white";
          ctx.arc(x + offset, y - r * 0.15, r * 0.25, 0, Math.PI * 2);
          ctx.fill();

          ctx.beginPath();
          ctx.fillStyle = "#162a88";
          ctx.arc(
            x + offset + d.x * r * 0.09,
            y - r * 0.15 + d.y * r * 0.09,
            r * 0.11,
            0,
            Math.PI * 2
          );
          ctx.fill();
        }
      }
    }

    function gameLoop(time) {
      const dt = Math.min((time - lastTime) / 1000, 0.04);
      lastTime = time;

      if (running) {
        moveActor(player, 6.3, dt, true);

        ghosts.forEach((ghost, index) => {
          const speed = time < frightenedUntil
            ? 3.5
            : 4.1 + level * 0.15 + index * 0.05;

          moveActor(ghost, speed, dt);
        });

        checkCollisions();
      }

      drawMaze();
      drawPlayer(time);
      ghosts.forEach(ghost => drawGhost(ghost, time));
      requestAnimationFrame(gameLoop);
    }

    const keyDirections = {
      ArrowLeft: "left",
      ArrowRight: "right",
      ArrowUp: "up",
      ArrowDown: "down",
      a: "left",
      d: "right",
      w: "up",
      s: "down"
    };

    addEventListener("keydown", event => {
      const direction = keyDirections[event.key] ||
        keyDirections[event.key.toLowerCase()];

      if (direction) {
        event.preventDefault();
        player.nextDir = direction;
      }
    });

    let touchStart = null;

    canvas.addEventListener("pointerdown", event => {
      touchStart = { x: event.clientX, y: event.clientY };
    });

    canvas.addEventListener("pointerup", event => {
      if (!touchStart) return;

      const dx = event.clientX - touchStart.x;
      const dy = event.clientY - touchStart.y;

      if (Math.abs(dx) > Math.abs(dy)) {
        player.nextDir = dx > 0 ? "right" : "left";
      } else {
        player.nextDir = dy > 0 ? "down" : "up";
      }

      touchStart = null;
    });

    document.getElementById("restart").addEventListener("click", newGame);
    addEventListener("resize", resize);

    resize();
    newGame();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
