<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Kombate Mortal</title>
<style>
  body{margin:0;background:#000;display:flex;flex-direction:column;align-items:center;font-family:Impact,Arial Black,sans-serif;color:#fff}
  canvas{border:3px solid #600;margin-top:10px;box-shadow:0 0 30px #a00}
  #info{font-family:Arial;font-size:13px;color:#aaa;margin:8px;text-align:center}
</style>
</head>
<body>
<canvas id="c" width="900" height="500"></canvas>
<div id="info">
  <b>P1 (Amarelo):</b> A/D andar · W pular · S defender · F soco · G chute · H especial (bola de fogo)<br>
  <b>P2 (Azul):</b> ←/→ andar · ↑ pular · ↓ defender · K soco · L chute · J especial<br>
  <b>T</b> = alternar P2 humano / CPU · <b>Enter</b> = começar / próxima luta
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=900,H=500,GROUND=420,GRAV=0.8;
const keys={},pressed={};
addEventListener('keydown',e=>{if(!keys[e.code])pressed[e.code]=true;keys[e.code]=true;if(e.code.startsWith('Arrow'))e.preventDefault();});
addEventListener('keyup',e=>keys[e.code]=false);

let cpu=true,state='menu',timer=99,frame=0,msg='',msgT=0,particles=[],projectiles=[],shake=0,finishMode=false;
let wins=[0,0];

class Fighter{
  constructor(x,color,dark,name,ctrl,facing){
    Object.assign(this,{startX:x,color,dark,name,ctrl,startFacing:facing});
    this.reset();
  }
  reset(){
    this.x=this.startX;this.y=GROUND;this.vy=0;this.hp=100;this.facing=this.startFacing;
    this.action='idle';this.actT=0;this.stun=0;this.block=false;this.cool=0;this.hitDone=false;this.walk=0;this.dead=false;
  }
  get onGround(){return this.y>=GROUND}
  input(opp){
    if(this.dead||this.stun>0)return;
    let c=this.ctrl,left,right,up,down,p,k,s;
    if(c==='ai'){[left,right,up,down,p,k,s]=this.ai(opp);}
    else{left=keys[c.l];right=keys[c.r];up=keys[c.u];down=keys[c.d];p=pressed[c.p];k=pressed[c.k];s=pressed[c.s];}
    this.block=down&&this.onGround&&this.action==='idle';
    if(this.action==='idle'&&!this.block){
      if(left){this.x-=4.5;this.walk++;}
      if(right){this.x+=4.5;this.walk++;}
      if(up&&this.onGround)this.vy=-15;
      if(p)this.attack('punch');
      else if(k)this.attack('kick');
      else if(s&&this.cool<=0)this.attack('special');
    }
  }
  ai(o){
    const d=Math.abs(o.x-this.x),toward=o.x>this.x;
    let l=false,r=false,u=false,dn=false,p=false,k=false,s=false;
    const rnd=Math.random();
    if(projectiles.some(pr=>pr.owner!==this&&Math.abs(pr.x-this.x)<160)){ if(rnd<0.5)u=true;else dn=true; }
    else if(d>230){ if(rnd<0.012&&this.cool<=0)s=true; else {toward?r=true:l=true;} }
    else if(d>85){ toward?r=true:l=true; if(rnd<0.01)u=true; }
    else{
      if(o.action!=='idle'&&rnd<0.4)dn=true;
      else if(rnd<0.06)p=true;
      else if(rnd<0.09)k=true;
      else if(rnd<0.11){toward?l=true:r=true;}
    }
    return [l,r,u,dn,p,k,s];
  }
  attack(t){this.action=t;this.actT=0;this.hitDone=false;}
  update(opp){
    this.input(opp);
    this.vy+=GRAV;this.y+=this.vy;
    if(this.y>GROUND){this.y=GROUND;this.vy=0;}
    this.x=Math.max(40,Math.min(W-40,this.x));
    if(this.action==='idle'&&!this.dead)this.facing=opp.x>this.x?1:-1;
    if(this.stun>0)this.stun--;
    if(this.cool>0)this.cool--;
    if(this.action!=='idle'){
      this.actT++;
      const A={punch:{dur:16,from:5,to:9,range:75,dmg:6},kick:{dur:26,from:10,to:15,range:95,dmg:10},special:{dur:30}}[this.action];
      if(this.action==='special'&&this.actT===15){
        projectiles.push({x:this.x+this.facing*50,y:this.y-95,vx:this.facing*9,owner:this,color:this.color});
        this.cool=100;
      }
      if(A.range&&!this.hitDone&&this.actT>=A.from&&this.actT<=A.to){
        const dx=(opp.x-this.x)*this.facing;
        if(dx>0&&dx<A.range&&Math.abs(opp.y-this.y)<90){this.hitDone=true;hit(opp,A.dmg,this.facing);}
      }
      if(this.actT>=A.dur)this.action='idle';
    }
    // empurrar para não sobrepor
    const dx=opp.x-this.x;
    if(Math.abs(dx)<50&&Math.abs(opp.y-this.y)<80){const push=(50-Math.abs(dx))/2;this.x-=Math.sign(dx||1)*push;}
  }
  draw(){
    const x=this.x,y=this.y,f=this.facing;
    ctx.save();ctx.translate(x,y);
    if(this.dead){ctx.rotate(-f*Math.PI/2);ctx.translate(0,-10);}
    if(this.stun>0&&frame%4<2)ctx.globalAlpha=0.6;
    const bob=this.action==='idle'?Math.sin(frame/8)*2:0;
    const sw=Math.sin(this.walk/5)*12;
    ctx.lineCap='round';
    // pernas
    ctx.strokeStyle=this.dark;ctx.lineWidth=14;
    line(0,-60,-12+sw*(this.block?0:1),0);
    if(this.action==='kick'&&this.actT>6&&this.actT<20)line(0,-60,f*85,-80);
    else line(0,-60,12-sw,0);
    // corpo
    ctx.fillStyle=this.color;
    ctx.fillRect(-18,-125+bob,36,68);
    ctx.fillStyle=this.dark;ctx.fillRect(-18,-70+bob,36,8); // faixa
    // braços
    ctx.strokeStyle=this.color;ctx.lineWidth=11;
    if(this.block){line(0,-115+bob,f*22,-130);line(0,-105+bob,f*24,-115);}
    else if(this.action==='punch'&&this.actT>3&&this.actT<11){line(0,-112,f*70,-110);line(0,-108,f*-10,-85);}
    else if(this.action==='special'&&this.actT>8){line(0,-112,f*55,-100);line(0,-108,f*55,-92);}
    else{line(0,-112+bob,f*20,-90+bob);line(0,-112+bob,f*-14,-85+bob);}
    // cabeça (máscara ninja)
    ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(0,-142+bob,17,0,7);ctx.fill();
    ctx.fillStyle='#e8b98a';ctx.fillRect(f>0?-2:-15,-148+bob,17,8);
    ctx.fillStyle=this.dead?'#000':'#fff';ctx.fillRect(f>0?7:-11,-146+bob,5,4);
    ctx.restore();
  }
}
function line(a,b,c,d){ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke();}

function hit(t,dmg,dir){
  if(t.dead)return;
  if(t.block&&t.facing===-dir){dmg=Math.ceil(dmg/5);t.x+=dir*6;spark(t.x-dir*20,t.y-110,'#ff0',6);}
  else{t.stun=14;t.action='idle';t.x+=dir*22;blood(t.x,t.y-110,dir,14);shake=8;}
  if(finishMode){t.dead=true;t.hp=0;blood(t.x,t.y-110,dir,80);shake=25;endRound(t===p1?1:0,true);return;}
  t.hp=Math.max(0,t.hp-dmg);
}
function blood(x,y,dir,n){for(let i=0;i<n;i++)particles.push({x,y,vx:dir*Math.random()*7+(Math.random()-.5)*4,vy:-Math.random()*9,life:60,c:'#b00000',s:3+Math.random()*4});}
function spark(x,y,c,n){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,life:15,c,s:3});}

const p1=new Fighter(220,'#e6c200','#7a6500','ESCORPIÃO DOURADO',{l:'KeyA',r:'KeyD',u:'KeyW',d:'KeyS',p:'KeyF',k:'KeyG',s:'KeyH'},1);
const p2ctrl={l:'ArrowLeft',r:'ArrowRight',u:'ArrowUp',d:'ArrowDown',p:'KeyK',k:'KeyL',s:'KeyJ'};
const p2=new Fighter(680,'#2a7fff','#123c80','LOBO DE GELO','ai',-1);

function startRound(){p1.reset();p2.reset();projectiles=[];particles=[];timer=99;finishMode=false;state='fight';say('LUTEM!',90);}
function say(t,d){msg=t;msgT=d;}
function endRound(winner,fatal){
  state='over';wins[winner]++;
  const w=winner===0?p1:p2;
  say(fatal?'FATALIDADE!':`${w.name} VENCE!`,9999);
  setTimeout(()=>{if(state==='over')say((fatal?'FATALIDADE! ':'')+`${w.name} VENCE!  [Enter]`,9999);},1500);
}

function update(){
  frame++;
  if(pressed.KeyT){cpu=!cpu;p2.ctrl=cpu?'ai':p2ctrl;say(cpu?'P2: CPU':'P2: HUMANO',60);}
  if(pressed.Enter&&state!=='fight')startRound();
  if(state==='fight'){
    p1.update(p2);p2.update(p1);
    if(frame%60===0&&!finishMode&&timer>0)timer--;
    projectiles=projectiles.filter(pr=>{
      pr.x+=pr.vx;
      const t=pr.owner===p1?p2:p1;
      if(Math.abs(pr.x-t.x)<35&&Math.abs(pr.y-(t.y-95))<60){hit(t,12,Math.sign(pr.vx));spark(pr.x,pr.y,'#f80',20);return false;}
      return pr.x>-50&&pr.x<W+50;
    });
    if(!finishMode){
      const loser=p1.hp<=0?p1:p2.hp<=0?p2:null;
      if(loser||timer<=0){
        const l=loser||(p1.hp<p2.hp?p1:p2);
        l.hp=0;l.stun=99999;finishMode=true;timer=6;say('ACABE COM ELE!',9999);
      }
    }else if(frame%60===0){
      timer--;
      if(timer<=0){const l=p1.stun>9000?p1:p2;l.dead=true;endRound(l===p1?1:0,false);}
    }
  }
  particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.4;if(p.y>GROUND+5){p.y=GROUND+5;p.vx*=0.5;p.vy=0;}return --p.life>0;});
  if(shake>0)shake--;
  if(msgT>0)msgT--;
  for(const k in pressed)delete pressed[k];
}

function drawBG(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a0000');g.addColorStop(1,'#4a0a00');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ff6a00';ctx.globalAlpha=.25;ctx.beginPath();ctx.arc(W/2,170,90,0,7);ctx.fill();ctx.globalAlpha=1;
  ctx.fillStyle='#120000';
  for(let i=0;i<9;i++){const x=i*110+20;ctx.fillRect(x,180,30,GROUND-180);ctx.fillRect(x-10,170,50,14);}
  for(let i=0;i<6;i++){const fx=60+i*160,fy=230;ctx.fillStyle=`hsl(${25+Math.random()*20},100%,55%)`;ctx.beginPath();ctx.ellipse(fx,fy,8,14+Math.random()*6,0,0,7);ctx.fill();}
  ctx.fillStyle='#2a0d05';ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.strokeStyle='#3d1608';for(let i=0;i<W;i+=60)line(i,GROUND,i-40,H);
}
function drawHUD(){
  const bar=(x,hp,flip,name,w)=>{
    ctx.fillStyle='#300';ctx.fillRect(x,20,350,26);
    ctx.fillStyle=hp>30?'#0c0':'#d00';
    const len=350*hp/100;ctx.fillRect(flip?x+350-len:x,20,len,26);
    ctx.strokeStyle='#fc0';ctx.lineWidth=2;ctx.strokeRect(x,20,350,26);
    ctx.fillStyle='#fff';ctx.font='18px Impact';ctx.textAlign=flip?'right':'left';
    ctx.fillText(name,flip?x+350:x,66);
    ctx.fillStyle='#fc0';ctx.fillText('★'.repeat(w),flip?x+350-ctx.measureText(name).width-10:x+ctx.measureText(name).width+10,66);
  };
  bar(20,p1.hp,false,p1.name,wins[0]);bar(530,p2.hp,true,p2.name+(cpu?' (CPU)':''),wins[1]);
  ctx.fillStyle='#fc0';ctx.font='40px Impact';ctx.textAlign='center';ctx.fillText(timer,W/2,50);
}
function drawMsg(t,size,col){
  ctx.font=size+'px Impact';ctx.textAlign='center';ctx.lineWidth=6;ctx.strokeStyle='#000';
  ctx.strokeText(t,W/2,H/2-20);ctx.fillStyle=col;ctx.fillText(t,W/2,H/2-20);
}

function render(){
  ctx.save();
  if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  drawBG();
  p1.draw();p2.draw();
  for(const pr of projectiles){
    ctx.fillStyle=pr.color;ctx.beginPath();ctx.arc(pr.x,pr.y,14,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(pr.x,pr.y,6,0,7);ctx.fill();
    spark(pr.x-pr.vx,pr.y,pr.color,1);
  }
  for(const p of particles){ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s);}
  ctx.restore();
  if(state==='menu'){
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);
    drawMsg('KOMBATE MORTAL',80,'#d00');
    ctx.font='24px Impact';ctx.fillStyle='#fc0';ctx.fillText('Pressione ENTER para lutar',W/2,H/2+40);
  }else{
    drawHUD();
    if(msgT>0)drawMsg(msg,msg.length>16?44:64,msg.includes('FATAL')||msg.includes('ACABE')?'#d00':'#fc0');
  }
}
(function loop(){update();render();requestAnimationFrame(loop);})();
</script>
</body>
</html>
