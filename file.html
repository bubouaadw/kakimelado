<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Cobrinha</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #101418;
      color: #f5f5f5;
      font-family: system-ui, sans-serif;
    }

    .jogo {
      width: min(92vw, 480px);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      color: #7cff72;
    }

    .painel {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-weight: 700;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      border: 4px solid #29333d;
      border-radius: 10px;
      background: #172028;
      box-shadow: 0 12px 35px #0008;
    }

    .acoes {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 14px 0;
    }

    button {
      min-width: 55px;
      min-height: 48px;
      border: 0;
      border-radius: 10px;
      background: #29333d;
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:hover {
      background: #3b4a57;
    }

    #reiniciar {
      background: #58d64f;
      color: #071307;
      padding: 0 20px;
    }

    .controles {
      display: grid;
      grid-template-columns: repeat(3, 58px);
      gap: 7px;
      justify-content: center;
    }

    .cima {
      grid-column: 2;
    }

    .esquerda {
      grid-column: 1;
      grid-row: 2;
    }

    .baixo {
      grid-column: 2;
      grid-row: 2;
    }

    .direita {
      grid-column: 3;
      grid-row: 2;
    }

    .mensagem {
      min-height: 24px;
      margin: 12px 0;
      color: #ffcf5a;
      font-weight: 700;
    }

    .instrucao {
      color: #aebac4;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <main class="jogo">
    <h1>Jogo da Cobrinha</h1>

    <div class="painel">
      <span>Pontos: <strong id="pontos">0</strong></span>
      <span>Recorde: <strong id="recorde">0</strong></span>
    </div>

    <canvas id="tabuleiro" width="400" height="400"></canvas>

    <p class="mensagem" id="mensagem">
      Pressione uma direção para começar
    </p>

    <div class="acoes">
      <button id="reiniciar">Reiniciar</button>
    </div>

    <div class="controles" aria-label="Controles">
      <button class="cima" data-direcao="cima">▲</button>
      <button class="esquerda" data-direcao="esquerda">◀</button>
      <button class="baixo" data-direcao="baixo">▼</button>
      <button class="direita" data-direcao="direita">▶</button>
    </div>

    <p class="instrucao">Use as setas, WASD ou os botões.</p>
  </main>

  <script>
    const canvas = document.getElementById("tabuleiro");
    const contexto = canvas.getContext("2d");
    const pontosElemento = document.getElementById("pontos");
    const recordeElemento = document.getElementById("recorde");
    const mensagemElemento = document.getElementById("mensagem");

    const tamanhoCelula = 20;
    const quantidadeCelulas = canvas.width / tamanhoCelula;
    const velocidade = 110;

    let cobra;
    let comida;
    let direcao;
    let proximaDirecao;
    let pontos;
    let intervalo;
    let jogando;
    let recorde = Number(localStorage.getItem("recordeCobrinha")) || 0;

    recordeElemento.textContent = recorde;

    function iniciarJogo() {
      cobra = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];

      direcao = { x: 0, y: 0 };
      proximaDirecao = { x: 0, y: 0 };
      pontos = 0;
      jogando = false;

      clearInterval(intervalo);
      pontosElemento.textContent = pontos;
      mensagemElemento.textContent = "Pressione uma direção para começar";

      criarComida();
      desenhar();
    }

    function criarComida() {
      do {
        comida = {
          x: Math.floor(Math.random() * quantidadeCelulas),
          y: Math.floor(Math.random() * quantidadeCelulas)
        };
      } while (
        cobra.some(parte => parte.x === comida.x && parte.y === comida.y)
      );
    }

    function mudarDirecao(novaDirecao) {
      const direcoes = {
        cima: { x: 0, y: -1 },
        baixo: { x: 0, y: 1 },
        esquerda: { x: -1, y: 0 },
        direita: { x: 1, y: 0 }
      };

      const nova = direcoes[novaDirecao];
      if (!nova) return;

      const estaInvertendo =
        nova.x === -direcao.x &&
        nova.y === -direcao.y &&
        cobra.length > 1;

      if (estaInvertendo) return;

      proximaDirecao = nova;

      if (!jogando) {
        jogando = true;
        mensagemElemento.textContent = "";
        intervalo = setInterval(atualizar, velocidade);
      }
    }

    function atualizar() {
      direcao = proximaDirecao;

      const novaCabeca = {
        x: cobra[0].x + direcao.x,
        y: cobra[0].y + direcao.y
      };

      const saiuDoTabuleiro =
        novaCabeca.x < 0 ||
        novaCabeca.x >= quantidadeCelulas ||
        novaCabeca.y < 0 ||
        novaCabeca.y >= quantidadeCelulas;

      const bateuNaCobra = cobra.some(
        parte => parte.x === novaCabeca.x && parte.y === novaCabeca.y
      );

      if (saiuDoTabuleiro || bateuNaCobra) {
        finalizarJogo();
        return;
      }

      cobra.unshift(novaCabeca);

      const comeu =
        novaCabeca.x === comida.x &&
        novaCabeca.y === comida.y;

      if (comeu) {
        pontos++;
        pontosElemento.textContent = pontos;
        criarComida();
      } else {
        cobra.pop();
      }

      desenhar();
    }

    function desenhar() {
      contexto.fillStyle = "#172028";
      contexto.fillRect(0, 0, canvas.width, canvas.height);

      desenharGrade();

      contexto.fillStyle = "#ff4f64";
      contexto.beginPath();
      contexto.arc(
        comida.x * tamanhoCelula + tamanhoCelula / 2,
        comida.y * tamanhoCelula + tamanhoCelula / 2,
        tamanhoCelula / 2 - 2,
        0,
        Math.PI * 2
      );
      contexto.fill();

      cobra.forEach((parte, indice) => {
        contexto.fillStyle = indice === 0 ? "#a2ff73" : "#54d653";

        contexto.fillRect(
          parte.x * tamanhoCelula + 1,
          parte.y * tamanhoCelula + 1,
          tamanhoCelula - 2,
          tamanhoCelula - 2
        );
      });
    }

    function desenharGrade() {
      contexto.strokeStyle = "#1e2a33";
      contexto.lineWidth = 1;

      for (let i = 0; i <= canvas.width; i += tamanhoCelula) {
        contexto.beginPath();
        contexto.moveTo(i, 0);
        contexto.lineTo(i, canvas.height);
        contexto.stroke();

        contexto.beginPath();
        contexto.moveTo(0, i);
        contexto.lineTo(canvas.width, i);
        contexto.stroke();
      }
    }

    function finalizarJogo() {
      clearInterval(intervalo);
      jogando = false;

      if (pontos > recorde) {
        recorde = pontos;
        localStorage.setItem("recordeCobrinha", recorde);
        recordeElemento.textContent = recorde;
      }

      mensagemElemento.textContent =
        `Fim de jogo! Você fez ${pontos} ponto${pontos === 1 ? "" : "s"}.`;
    }

    const teclas = {
      ArrowUp: "cima",
      w: "cima",
      W: "cima",
      ArrowDown: "baixo",
      s: "baixo",
      S: "baixo",
      ArrowLeft: "esquerda",
      a: "esquerda",
      A: "esquerda",
      ArrowRight: "direita",
      d: "direita",
      D: "direita"
    };

    document.addEventListener("keydown", evento => {
      const novaDirecao = teclas[evento.key];

      if (novaDirecao) {
        evento.preventDefault();
        mudarDirecao(novaDirecao);
      }
    });

    document.querySelectorAll("[data-direcao]").forEach(botao => {
      botao.addEventListener("click", () => {
        mudarDirecao(botao.dataset.direcao);
      });
    });

    document
      .getElementById("reiniciar")
      .addEventListener("click", iniciarJogo);

    iniciarJogo();
  </script>
</body>
</html>
